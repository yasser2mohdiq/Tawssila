spring.application.name=Tawssila
spring.config.import=optional:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tawssila_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT — override secret in application-local.properties (Base64, >= 256 bits)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default admin — override password in application-local.properties
app.admin.email=${ADMIN_EMAIL:admin@tawssila.local}
app.admin.password=${ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html
